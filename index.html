<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Powerbank Radar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <style>
    :root {
      --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --card: #f6f6f7; --border: #e2e2e5;
      --accent: #1f6feb; --you: #1f6feb;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111214; --fg: #ececec; --muted: #9a9a9a; --card: #1b1c1f; --border: #2c2d31; --accent: #4c8dff; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .app { display: grid; grid-template-columns: 360px 1fr; height: 100%; }
    aside { border-right: 1px solid var(--border); overflow-y: auto; padding: 16px; }
    #map { height: 100%; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
    button.primary { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--accent);
      color: #fff; font-size: 15px; cursor: pointer; }
    .hint { color: var(--muted); font-size: 12px; margin: 6px 0 12px; }
    /* Filter dropdowns: a button per filter that opens a checklist below it */
    .filter-bar { display: flex; gap: 6px; margin-bottom: 8px; }
    .dd { flex: 1; display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 7px 10px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--fg);
      font-size: 13px; cursor: pointer; min-width: 0; }
    .dd > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dd[aria-expanded="true"] { border-color: var(--accent); }
    .dd[aria-expanded="true"] .caret { transform: rotate(180deg); }
    .caret { display: inline-block; transition: transform .2s; color: var(--muted); }
    .dd-panel { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; padding: 4px 0; }
    .dd-panel[hidden] { display: none; }
    .dd-actions { display: flex; gap: 12px; padding: 4px 12px 6px; border-bottom: 1px solid var(--border); margin-bottom: 2px; }
    .dd-actions button { border: 0; background: none; color: var(--accent); font-size: 12px; padding: 0; cursor: pointer; }
    .opt { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; user-select: none; }
    .opt input { margin: 0; }
    .opt .count { margin-left: auto; color: var(--muted); font-size: 12px; }
    .opt.soon { color: var(--muted); cursor: default; font-size: 12px; }
    .toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 12px; cursor: pointer; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
    .status { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    ol.nearest { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
    .card .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .card .name { font-weight: 600; font-size: 14px; display: flex; gap: 6px; align-items: center; }
    .card .dist { font-weight: 600; font-size: 14px; white-space: nowrap; }
    .card .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .badge { font-size: 11px; border-radius: 4px; padding: 1px 5px; margin-left: 4px; white-space: nowrap; }
    .b-online { background: #d3f5df; color: #145c2e; }
    .b-offline { background: #fde2e1; color: #8a1c17; }
    .b-unknown { background: #e8e8ea; color: #444; }
    .card a, .leaflet-popup-content a { display: inline-block; margin-top: 6px; font-size: 13px; color: var(--accent); text-decoration: none; }
    /* Station details (popup + nearest list) */
    .op-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .op-logo { width: 32px; height: 32px; border-radius: 8px; border: 2px solid; background: #fff; object-fit: contain; padding: 2px; flex: none; }
    .op-name { font-weight: 700; font-size: 15px; }
    .op-head .badge { margin-left: 0; }
    .venue { font-weight: 600; font-size: 14px; margin-top: 8px; }
    .addr, .walk { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .walk b { color: var(--fg); }
    .price { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; margin-top: 8px; }
    .price-main { font-weight: 600; font-size: 13px; }
    .price-extra { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .price-line { color: var(--fg); font-weight: 600; margin-top: 6px; }
    .avail { font-size: 12px; margin-top: 6px; color: #145c2e; }
    .avail.none { color: #8a1c17; }
    .avail .asof { color: #888; }
    .avail.checking { color: #888; }
    .avail-chip { font-size: 11px; font-weight: 700; background: #d3f5df; color: #145c2e; border-radius: 4px; padding: 1px 5px; }
    .avail-chip.none { background: #fde2e1; color: #8a1c17; }
    .place { margin-top: 8px; padding: 0 2px; }
    .place .venue { margin-top: 0; }
    .pdetails { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-bottom: 6px; }
    .ptype { font-size: 12px; font-weight: 600; background: #eef3ff; color: #1f4fa8; border-radius: 999px; padding: 2px 8px; }
    .pnote { font-size: 12px; color: #444; padding: 2px 0; }
    .hours { font-size: 12px; color: #444; display: inline-flex; align-items: center; gap: 4px; }
    .open-pill { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 5px; }
    .open-pill.is-open { background: #d3f5df; color: #145c2e; }
    .open-pill.is-closed { background: #fde2e1; color: #8a1c17; }
    .hours.muted { color: #888; }
    .links { display: flex; gap: 14px; flex-wrap: wrap; }
    .leaflet-popup-content { margin: 12px 14px; min-width: 220px; }
    .leaflet-popup-content .station { color: #1a1a1a; }
    .leaflet-popup-content .price { background: #f6f6f7; border-color: #e2e2e5; }
    .leaflet-popup-content .addr, .leaflet-popup-content .walk, .leaflet-popup-content .price-extra { color: #666; }
    .logo-sm { width: 16px; height: 16px; border-radius: 4px; object-fit: contain; flex: none; background: #fff; }
    .logo-pin { width: 100%; height: 100%; border-radius: 50%; background: #fff; border: 2px solid;
      box-shadow: 0 1px 4px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .logo-pin img { width: 74%; height: 74%; object-fit: contain; }
    .logo-pin.offline { opacity: .45; filter: grayscale(1); }
    .cluster { border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: 13px;
      display: flex; align-items: center; justify-content: center; border: 3px solid rgba(255,255,255,.9);
      box-shadow: 0 0 0 4px rgba(31,111,235,.25), 0 2px 6px rgba(0,0,0,.3); }
    .you-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--you); border: 3px solid #fff;
      box-shadow: 0 0 0 6px rgba(31,111,235,.25); }
    .sheet-head { display: flex; gap: 8px; }
    .sheet-head button.primary { flex: 1; }
    button.filter-toggle { display: none; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--card); color: var(--fg); font-size: 15px; cursor: pointer; white-space: nowrap; }
    aside.open button.filter-toggle .caret { transform: rotate(180deg); }
    .status { margin-top: 10px; }
    .leaflet-control-attribution { font-size: 10px; }
    /* Phones: map fills the screen; the panel is a compact bar that opens into a filter sheet */
    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; height: 100dvh; }
      aside { order: 2; border-right: 0; border-top: 1px solid var(--border); border-radius: 14px 14px 0 0;
        box-shadow: 0 -4px 16px rgba(0,0,0,.12); padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        max-height: 30dvh; overflow-y: auto; position: relative; z-index: 500; margin-top: -14px; background: var(--bg); }
      .brand, .hint { display: none; }
      .sheet-head button.primary, button.filter-toggle { padding: 8px 12px; font-size: 14px; }
      button.filter-toggle { display: inline-block; }
      .status { margin: 6px 2px 0; font-size: 12px; cursor: pointer; }
      .sheet-body { display: none; padding-top: 8px; }
      aside.open .sheet-body { display: block; }
      .opt { padding: 7px 12px; }
      .toggle { font-size: 12px; margin-bottom: 8px; }
      ol.nearest { gap: 6px; }
      .card { padding: 7px 10px; }
      .card .name, .card .dist { font-size: 13px; }
      .card a { margin-top: 3px; font-size: 12px; }
      .leaflet-control-attribution { font-size: 9px; opacity: .7; }
      /* Nearest stations float above the bar as a slim strip of cards, so the sheet stays closed */
      .sheet-body .nearest { display: none; }
      .near-strip:not([hidden]) { display: flex; }
    }
    /* Sits at the bottom of the map; 22px clears the sheet's rounded top that overlaps the map */
    .near-strip { display: none; position: absolute; left: 0; right: 0; bottom: 22px; gap: 8px;
      overflow-x: auto; padding: 0 12px; scroll-snap-type: x mandatory; scrollbar-width: none; z-index: 1000; }
    .near-strip::-webkit-scrollbar { display: none; }
    .mini { flex: none; width: 72%; max-width: 260px; scroll-snap-align: start; background: var(--bg);
      border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.18); padding: 8px 10px; cursor: pointer; }
    .mini .top { display: flex; align-items: center; gap: 6px; }
    .mini .logo-sm { width: 22px; height: 22px; border-radius: 6px; }
    .mini .op { font-weight: 700; font-size: 13px; }
    .mini .km { margin-left: auto; font-weight: 700; font-size: 13px; white-space: nowrap; }
    .mini .v { font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini .p { font-size: 11px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini.close-card { width: auto; display: flex; align-items: center; color: var(--muted); font-size: 18px; padding: 8px 14px; }
  </style>
</head>
<body>
<div class="app">
  <aside id="panel">
    <div class="brand">
      <h1>Powerbank Radar</h1>
      <p class="sub">Power bank rental stations from every brand, on one map.</p>
    </div>
    <div class="sheet-head">
      <button class="primary" id="locate">📍 Find stations near me</button>
      <button class="filter-toggle" id="filterToggle" aria-expanded="false" aria-controls="sheetBody">Filters<span id="filterCount"></span> <span class="caret">▴</span></button>
    </div>
    <div class="status" id="status">Loading stations…</div>
    <div class="sheet-body" id="sheetBody">
      <p class="hint">No location access? Click anywhere on the map to set your position.</p>
      <div class="filter-bar">
        <button class="dd" id="countryBtn" aria-expanded="false" aria-controls="countryPanel"><span id="countryLabel">Country</span><span class="caret">▾</span></button>
        <button class="dd" id="opBtn" aria-expanded="false" aria-controls="opPanel"><span id="opLabel">Operators</span><span class="caret">▾</span></button>
        <button class="dd" id="typeBtn" aria-expanded="false" aria-controls="typePanel"><span id="typeLabel">Types</span><span class="caret">▾</span></button>
      </div>
      <div class="dd-panel" id="countryPanel" hidden></div>
      <div class="dd-panel" id="opPanel" hidden></div>
      <div class="dd-panel" id="typePanel" hidden></div>      <label class="toggle"><input type="checkbox" id="hideOffline" checked> Hide stations reported offline / closed</label>
      <ol class="nearest" id="nearest"></ol>
    </div>
  </aside>
  <div id="map"><div class="near-strip" id="nearStrip" hidden></div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
  const OPERATOR_COLORS = {
    Buzz: '#f5b400', Juice: '#30a46c', Revive: '#e5484d', ICCXX: '#0090ff',
    Amlo: '#8e4ec6', AIRVALL: '#12a594', Wessview: '#f76b15', ChargeBuddies: '#d6409f',
    FireVolt: '#ff6a13', ANYWATT: '#e54666', VolterGy: '#3e63dd', Fully: '#46a758',
    'Fast Charger': '#0d74ce', Rechargy: '#6e56cf', 'Dead Batt': '#7cb518',
    Mobbi: '#1a1a1a', 'Recharge.me': '#e5484d'
  };
  const FALLBACK_COLORS = ['#5b5bd6', '#978365', '#6e56cf'];
  // Icons downloaded from each operator's own website (scripts/fetch_logos.py)
  const LOGOS = {
    Buzz: 'logos/buzz.ico', Juice: 'logos/juice.png', Revive: 'logos/revive.svg', ICCXX: 'logos/iccxx.png',
    Amlo: 'logos/amlo.png', AIRVALL: 'logos/airvall.svg', Wessview: 'logos/wessview.png', ChargeBuddies: 'logos/chargebuddies.png',
    FireVolt: 'logos/firevolt.png', ANYWATT: 'logos/anywatt.ico', VolterGy: 'logos/voltergy.png', Fully: 'logos/fully.svg',
    'Fast Charger': 'logos/fastcharger.svg', Rechargy: 'logos/rechargy.webp', 'Dead Batt': 'logos/deadbatt.png',
    Mobbi: 'logos/mobbi.png', 'Recharge.me': 'logos/rechargeme.png'
  };
  // Consumer prices as published on each operator's website (checked 19 Nov 2026).
  // `price` is the headline; `extra` the small print. Operators that don't publish a price say where to see it.
  const OPERATOR_INFO = {
    Buzz: { price: '€3 / hour · max €9 / day', extra: '€30 deposit, refunded on return · 33% cheaper in the Buzz app', site: 'https://buzzpowerbanks.nl/' },
    Juice: { price: 'Price varies per location', extra: 'Shown on the station screen before you rent · deposit held on your card', site: 'https://getjuice.nl/' },
    Revive: { price: 'Price shown in the Revive app', extra: 'Billed per started half hour', site: 'https://revivesharing.com/nl/en' },
    Amlo: { price: '€2.50 / hour', extra: 'Rent by scanning the QR code on the station', site: 'https://amlo.nl/' },
    ICCXX: { price: 'Max €3 per day', extra: 'Unused deposit is refunded', site: 'https://iccxx.nl/' },
    AIRVALL: { price: '€4 per 24 hours', extra: 'No hourly rate · no deposit in the app, deposit when paying by card', site: 'https://www.airvall.nl/' },
    Wessview: { price: '€2 / 30 min · max €10 / day', extra: '€20 deposit, refunded minus the rental', site: 'https://wessview.nl/' },
    ChargeBuddies: { price: '€2 first hour, then per minute', extra: '+ €0.50 unlock fee', site: 'https://chargebuddies.nl/prijzen' },
    // Spain
    FireVolt: { price: 'Price varies per station', extra: 'Shown on the station before you rent', site: 'https://www.firevolt.com/en/' },
    ANYWATT: { price: 'Price shown at the station', extra: 'Deposit pre-authorised on your card · pay only for the time used', site: 'https://anywatt.es/' },
    VolterGy: { price: '€1.75 / 30 min · max €8.75 / day', extra: 'First 5 min free · €19 deposit, refunded within 48 h', site: 'https://voltergy.es/' },
    Fully: { price: '€2–3 / hour', extra: 'Price depends on the venue', site: 'https://www.fullygo.com/' },
    // United Kingdom
    'Fast Charger': { price: 'Price shown in the Fast Charger app', extra: 'Rent by scanning the station with the app', site: 'https://www.fastcharger.uk/' },
    // Germany
    Rechargy: { price: 'Price shown in the app or at the terminal', extra: 'Rent with a QR code · return at any Rechargy station', site: 'https://rechargy.de/standorte/' },
    // Israel
    'Dead Batt': { price: '₪15 / hour · max ₪30 / 24 h', extra: 'No app: tap your card or phone on the station · return at any Dead Batt station', site: 'https://dead-batt.com/stations' },
    // Italy
    Mobbi: { price: '€1 / 30 min', extra: 'First 3 min free · rent by scanning the QR code', site: 'https://www.mobbi.it/' },
    'Recharge.me': { price: 'Price shown on the station screen', extra: 'Pay only for the time you use', site: 'https://rechargeme.app/' },
  };
  // Where an operator charges differently per country (keyed "operator:country")
  const OPERATOR_INFO_BY_COUNTRY = {
    'Buzz:ES': { price: '€1.99 / 30 min · max €10 / day', extra: 'Return at any Buzz station in the city', site: 'https://buzzpowerbanks.es/' },
    'Revive:ES': { price: 'Price shown in the Revive app', extra: 'Billed per started half hour', site: 'https://revivesharing.com/' },
    'Revive:GB': { price: 'Price shown in the Revive app', extra: 'Billed per started half hour', site: 'https://revivesharing.com/' },
    'Juice:FR': { price: 'Price varies per location', extra: 'Shown on the station screen before you rent', site: 'https://getjuice.fr/' },
    'Juice:DE': { price: 'Price varies per location', extra: 'Shown on the station screen before you rent', site: 'https://getjuice.nl/' },
  };
  // A station's own published price (FireVolt, Fully) beats the operator's general one
  function infoFor(s) {
    const base = OPERATOR_INFO_BY_COUNTRY[`${s.operator}:${s.country}`] || OPERATOR_INFO[s.operator];
    if (!base) return null;
    return s.price ? { ...base, price: s.price, extra: s.price_extra || base.extra } : base;
  }
  const brandMark = op => LOGOS[op]
    ? `<img class="logo-sm" src="${LOGOS[op]}" alt="">`
    : `<span class="dot" style="background:${operatorColor[op]}"></span>`;

  // Logo badge marker. Zoomed out, nearby stations merge into clusters, so pins only show close up
  const PIN_SIZE = 30;
  function logoIcon(s) {
    const size = PIN_SIZE;
    const inner = LOGOS[s.operator] ? `<img src="${LOGOS[s.operator]}" alt="">` : '';
    return L.divIcon({
      className: '',
      html: `<div class="logo-pin${s.status === 'offline' ? ' offline' : ''}" style="border-color:${operatorColor[s.operator]};${inner ? '' : `background:${operatorColor[s.operator]}`}">${inner}</div>`,
      iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -size / 2]
    });
  }
  const NEAREST_COUNT = 5;
  const WALK_KMH = 4.8;
  const STATUS_LABEL = { online: 'Online', offline: 'Offline / closed', unknown: 'Status unknown' };

  // Circle overlays (your accuracy ring) draw on canvas
  const map = L.map('map', { preferCanvas: true }).fitBounds([[29.4, -9.3], [58.6, 35.9]]); // all countries (the default)
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OSM</a>'
  }).addTo(map);
  map.attributionControl.setPrefix(false); // drop the "Leaflet" credit; OSM credit is required by its tile policy

  // Phone bottom sheet: tap "Filters" (or the status line) to open/close
  const panel = document.getElementById('panel');
  const filterToggle = document.getElementById('filterToggle');
  function setSheet(open) {
    panel.classList.toggle('open', open);
    filterToggle.setAttribute('aria-expanded', open);
    if (open) panel.scrollTop = 0;
    setTimeout(() => map.invalidateSize(), 50);
    if (stations.length) renderNearest();
  }
  filterToggle.addEventListener('click', () => setSheet(!panel.classList.contains('open')));
  document.getElementById('status').addEventListener('click', () => setSheet(!panel.classList.contains('open')));
  const isPhone = () => matchMedia('(max-width: 760px)').matches;
  if (isPhone()) map.attributionControl.setPosition('topright'); // keep the OSM credit clear of the nearest-stations strip

  let stations = [];
  let operatorColor = {};
  let enabled = new Set();
  // Add a country here when its stations are added to stations.json (keyed by ISO code)
  const COUNTRIES = {
    NL: { name: 'Netherlands', flag: '🇳🇱', bounds: [[50.75, 3.36], [53.55, 7.23]] },
    ES: { name: 'Spain', flag: '🇪🇸', bounds: [[36.0, -9.3], [43.8, 4.3]] },  // mainland + Balearics
    GB: { name: 'United Kingdom', flag: '🇬🇧', bounds: [[50.0, -6.0], [58.6, 1.8]] },
    FR: { name: 'France', flag: '🇫🇷', bounds: [[42.3, -4.8], [51.1, 8.2]] },
    DE: { name: 'Germany', flag: '🇩🇪', bounds: [[47.3, 5.9], [55.1, 15.0]] },
    IL: { name: 'Israel', flag: '🇮🇱', bounds: [[29.5, 34.25], [33.3, 35.9]] },
    IT: { name: 'Italy', flag: '🇮🇹', bounds: [[36.6, 6.6], [47.1, 18.5]] },
    CH: { name: 'Switzerland', flag: '🇨🇭', bounds: [[45.8, 5.95], [47.8, 10.5]] },
  };
  const ALL = 'ALL';  // "All countries", the default
  const ALL_COUNTRIES = { name: 'All countries', short: 'All', flag: '🌍', bounds: [[29.4, -9.3], [58.6, 35.9]] };
  let country = ALL;
  const inCountry = s => country === ALL || s.country === country;
  let markers = new Map();
  let you = null;
  let youMarker = null, youCircle = null;
  const hideOffline = document.getElementById('hideOffline');

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function haversineKm(a, b) {
    const R = 6371, toRad = d => d * Math.PI / 180;
    const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  const fmtDist = km => km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(1)} km`;
  const walkMin = km => Math.max(1, Math.round(km / WALK_KMH * 60));

  // Opens the place in Google Maps (pin + place card; the user can tap Directions there).
  // Uses the operator's Google place link when available, otherwise searches "venue, address"
  // so Google shows the business itself; falls back to the raw coordinates.
  function placeUrl(s) {
    if (s.google_maps_url) return s.google_maps_url;
    const isVenueName = s.name && s.address && !s.address.startsWith(s.name);
    const query = s.address ? (isVenueName ? `${s.name}, ${s.address}` : s.address) : `${s.lat},${s.lng}`;
    const p = new URLSearchParams({ api: '1', query });
    return `https://www.google.com/maps/search/?${p}`;
  }

  // Venue type filter; stations without a known type are grouped under NO_TYPE
  const NO_TYPE = '__none';
  const typeKey = s => s.place_type || NO_TYPE;
  let typeList = null;
  const allTypes = () => typeList ??= (() => {   // most common first, "not known" last
    const counts = {};
    stations.forEach(s => { counts[typeKey(s)] = (counts[typeKey(s)] || 0) + 1; });
    return Object.keys(counts).sort((a, b) => (a === NO_TYPE) - (b === NO_TYPE) || counts[b] - counts[a]);
  })();
  let enabledTypes = new Set();

  const isVisible = s => inCountry(s) && enabled.has(s.operator) && enabledTypes.has(typeKey(s))
    && !(hideOffline.checked && s.status === 'offline');
  const badge = s => `<span class="badge b-${s.status}">${STATUS_LABEL[s.status]}</span>`;

  // Power banks ready to rent and empty slots to return one, as counted when the data was downloaded
  // (Juice, Amlo, FireVolt, ANYWATT, Fully publish this; it is not live)
  let snapshot = {};
  const fmtDay = iso => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '';
  function availLine(s) {
    const live = s.live;                       // set by refreshLive() when the operator answered just now
    if (live?.loading && s.available == null) return `<div class="avail checking">🔋 Checking live availability…</div>`;
    const n = live && !live.loading ? live.available : s.available;
    const r = live && !live.loading ? live.returnable : s.returnable;
    if (n == null) return live?.offline ? `<div class="avail none">🔋 Station is offline right now</div>` : '';
    const banks = `<b>${n}</b> power bank${n === 1 ? '' : 's'} available`;
    const slots = r != null ? ` · ${r} free slot${r === 1 ? '' : 's'} to return` : '';
    const when = live?.loading ? ' · checking live…'
      : live ? ` · live, ${live.at.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`
      : ` · as of ${fmtDay(snapshot[s.country])}`;
    return `<div class="avail${n === 0 ? ' none' : ''}">🔋 ${banks}${slots}<span class="asof">${when}</span></div>`;
  }

  // ---- Live availability, fetched when someone opens a station ----
  // Only operators whose public feed lets other websites read it (CORS) can be asked from the browser.
  // FireVolt and Mobbi allow it. Juice, ANYWATT, Fully, Amlo and Recharge.me don't, so they go through the relay.
  const LIVE_SOURCES = {
    // FireVolt's web-app map feed: returns the stations around a point, with counts per station
    FireVolt: async s => {
      const form = new FormData();
      Object.entries({ coordType: 'WGS－84', mapType: 'WGS－84', lat: s.lat, lng: s.lng, zoomLevel: '4' })
        .forEach(([k, v]) => form.append(k, v));
      const res = await fetch('https://app.firevolt.com/cdb-app-api/v1/app/cdb/shop/listnear', { method: 'POST', body: form });
      const x = (await res.json()).list?.find(x => `firevolt-${x.newID}` === s.id);
      if (!x) throw new Error('station not in feed');
      const online = x.infoStatus === '在线';   // "online"
      return { offline: !online, available: online ? +x.freeNum : null, returnable: online ? +x.canReturnNum : null };
    },
    // Mobbi's web-app feed lists the whole network at once (~500 KB), so one download serves
    // every Mobbi station opened within a minute
    Mobbi: async s => {
      const list = await mobbiFeed();
      const x = list.find(x => `mobbi-${x.id}` === s.id);
      if (!x) throw new Error('station not in feed');
      return { offline: false, available: +x.borrow, returnable: +x.back };
    },
  };
  let mobbiCache = null;   // { at, promise }
  function mobbiFeed() {
    if (!mobbiCache || Date.now() - mobbiCache.at > 60 * 1000) {
      mobbiCache = { at: Date.now(), promise: fetch('https://console.mobbi.it/api/v1/merchants/listMerchantsForApp.json', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ memberId: '1', lat: '45.4642', lng: '9.19' }),
      }).then(r => r.json()) };
      mobbiCache.promise.catch(() => { mobbiCache = null; });
    }
    return mobbiCache.promise;
  }
  // The other operators go through our relay (relay/ folder, a Cloudflare Worker), which fetches
  // their feed server-side. Empty = no relay, so those stations keep the downloaded counts.
  // (To test relay changes locally: run `npx wrangler dev` in relay/ and use http://127.0.0.1:8787.)
  const RELAY_URL = 'https://powerbank-radar-relay.powerbankradar.workers.dev';
  if (RELAY_URL) ['Juice', 'ANYWATT', 'Fully', 'Amlo', 'Recharge.me'].forEach(op => {
    LIVE_SOURCES[op] = async s => {
      const res = await fetch(`${RELAY_URL}/live?op=${encodeURIComponent(op)}&id=${encodeURIComponent(s.id)}`);
      if (!res.ok) throw new Error(`relay answered ${res.status}`);
      return res.json();
    };
  });
  const LIVE_MAX_AGE_MS = 60 * 1000;   // re-ask at most once a minute per station

  async function refreshLive(s, marker) {
    const source = LIVE_SOURCES[s.operator];
    if (!source || (s.live && !s.live.loading && Date.now() - s.live.at < LIVE_MAX_AGE_MS)) return;
    const redraw = () => marker.isPopupOpen() && marker.getPopup().setContent(popupHtml(s));
    s.live = { ...(s.live || {}), loading: true };
    redraw();
    try {
      s.live = { ...(await source(s)), at: new Date() };
      if (s.live.offline) s.status = 'offline';
      else if (s.status === 'offline') s.status = 'online';
    } catch {
      s.live = null;   // keep showing the downloaded counts
    }
    redraw();
  }
  const availChip = s => s.available == null ? '' : `<span class="avail-chip${s.available === 0 ? ' none' : ''}">🔋 ${s.available}</span>`;
  const precisionNote = s => s.precision === 'street' ? '<br><i>Approximate location (street level)</i>' : '';

  // Operator header: big logo + operator name in its brand colour
  const opHeader = s => `<div class="op-head">
      ${LOGOS[s.operator] ? `<img class="op-logo" src="${LOGOS[s.operator]}" alt="" style="border-color:${operatorColor[s.operator]}">` : ''}
      <span class="op-name" style="color:${operatorColor[s.operator]}">${esc(s.operator)}</span>${badge(s)}</div>`;
  const priceBox = s => {
    const info = infoFor(s);
    if (!info) return '';
    return `<div class="price"><div class="price-main">💶 ${esc(info.price)}</div><div class="price-extra">${esc(info.extra)}</div></div>`;
  };

  // Where the station is: type of venue (from the operator, or read from the venue name),
  // the operator's placement note, and today's opening hours when published
  const PLACE_ICONS = {
    'Hotel': '🏨', 'Hostel': '🛏️', 'Restaurant': '🍽️', 'Café': '☕', 'Bar': '🍺', 'Club': '🎶', 'Nightclub': '🎶',
    'Beach club': '🏖️', 'Supermarket': '🛒', 'Gym': '🏋️', 'Entertainment venue': '🎳', 'School / university': '🎓',
    'Shopping centre': '🛍️', 'Train station': '🚉', 'Campsite / holiday park': '⛺', 'Phone shop': '📱',
    'Temporary location (event)': '🎪', 'Sports club': '🎾', 'Hair salon': '💇', 'Shop': '🛍️',
  };
  const placeIcon = s => s.place_type ? (PLACE_ICONS[s.place_type] || '📍') : '';
  // ---- Opening hours ----
  // s.schedule: 7 lists (Mon..Sun) of [open, close] minutes; close > 1440 = open past midnight.
  // Times are the venue's local time (the UK and the Canary Islands are an hour behind NL and mainland Spain).
  const zoneOf = s => s.country === 'GB' ? 'Europe/London' : s.country === 'IL' ? 'Asia/Jerusalem'
    : (s.lat < 30 && s.lng < -13) ? 'Atlantic/Canary' : 'Europe/Amsterdam';
  const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const nowCache = {};
  function localNow(zone) {      // { day: 0=Mon..6=Sun, min: minutes after midnight }
    const stamp = Math.floor(Date.now() / 60000);
    if (nowCache[zone]?.stamp === stamp) return nowCache[zone];
    const parts = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: zone, weekday: 'short',
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date()).map(p => [p.type, p.value]));
    return nowCache[zone] = { stamp, day: WEEKDAYS.indexOf(parts.weekday), min: +parts.hour * 60 + +parts.minute };
  }
  const hhmm = m => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;

  // { open, today: "09:00–04:00" | "Closed today", change: "closes 04:00" | "opens 10:00" | "opens Tue 10:00" }
  // or null when the operator publishes no hours
  function openState(s) {
    if (!s.schedule) return null;
    const { day, min } = localNow(zoneOf(s));
    const today = s.schedule[day], yesterday = s.schedule[(day + 6) % 7];
    const allDay = today.some(([a, b]) => a === 0 && b >= 1440);
    const todayText = !today.length ? 'Closed today' : allDay ? 'Open 24 hours'
      : today.map(([a, b]) => `${hhmm(a)}–${hhmm(b)}`).join(', ');
    const late = yesterday.find(([, b]) => b > 1440 && min < b - 1440);   // still open from last night
    if (late) return { open: true, today: todayText, change: `closes ${hhmm(late[1])}` };
    const now = today.find(([a, b]) => a <= min && min < b);
    if (now) return { open: true, today: todayText, change: allDay ? '' : `closes ${hhmm(now[1])}` };
    const later = today.find(([a]) => a > min);
    if (later) return { open: false, today: todayText, change: `opens ${hhmm(later[0])}` };
    for (let k = 1; k <= 7; k++) {
      const next = s.schedule[(day + k) % 7];
      if (next.length) return { open: false, today: todayText,
        change: `opens ${k === 1 ? 'tomorrow' : WEEKDAYS[(day + k) % 7]} ${hhmm(next[0][0])}` };
    }
    return { open: false, today: todayText, change: '' };
  }
  const openPill = st => st ? `<span class="open-pill ${st.open ? 'is-open' : 'is-closed'}">${st.open ? 'Open' : 'Closed'}</span>` : '';

  function placeDetails(s) {
    const rows = [];
    if (s.place_type) rows.push(`<span class="ptype">${placeIcon(s)} ${esc(s.place_type)}</span>`);
    const st = openState(s);
    rows.push(st
      ? `<span class="hours">${openPill(st)} 🕒 ${esc(st.today)}${st.change ? ` · ${esc(st.change)}` : ''}</span>`
      : `<span class="hours muted">🕒 Opening hours not published</span>`);
    if (s.placement_note) rows.push(`<span class="pnote">📌 ${esc(s.placement_note)}</span>`);
    return rows.length ? `<div class="pdetails">${rows.join('')}</div>` : '';
  }

  function popupHtml(s) {
    const km = you ? haversineKm(you, s) : null;
    const info = infoFor(s);
    return `<div class="station">${opHeader(s)}
      ${priceBox(s)}
      ${availLine(s)}
      <div class="place">
        ${placeDetails(s)}
        <div class="venue">${esc(s.name)}</div>
        <div class="addr">${esc(s.address)}${precisionNote(s)}</div>
        ${km != null ? `<div class="walk"><b>${fmtDist(km)}</b> · ~${walkMin(km)} min walk</div>` : ''}
      </div>
      <div class="links"><a href="${placeUrl(s)}" target="_blank" rel="noopener">View in Google Maps →</a>
      ${info ? `<a href="${info.site}" target="_blank" rel="noopener">${esc(s.operator)} website</a>` : ''}</div></div>`;
  }

  // Filter dropdowns: only one open at a time
  const DROPDOWNS = [['countryBtn', 'countryPanel'], ['opBtn', 'opPanel'], ['typeBtn', 'typePanel']];
  function openDropdown(btnId) {
    DROPDOWNS.forEach(([b, p]) => {
      const open = b === btnId && document.getElementById(p).hidden;
      document.getElementById(p).hidden = !open;
      document.getElementById(b).setAttribute('aria-expanded', open);
    });
  }
  DROPDOWNS.forEach(([b]) => document.getElementById(b).addEventListener('click', () => openDropdown(b)));

  function applyFilters() { renderMarkers(); renderNearest(); renderFilterLabels(); }

  function renderFilterLabels() {
    const c = country === ALL ? ALL_COUNTRIES : (COUNTRIES[country] || { name: country, flag: '' });
    // Three filter buttons share a phone-width row, so phones show the short country code
    document.getElementById('countryLabel').textContent = `${c.flag} ${isPhone() ? (c.short || country) : c.name}`.trim();
    const total = Object.keys(operatorColor).length;
    document.getElementById('opLabel').textContent = enabled.size === total ? 'All operators' : `Operators (${enabled.size}/${total})`;
    const typesTotal = allTypes().length;
    document.getElementById('typeLabel').textContent = enabledTypes.size === typesTotal ? 'All types' : `Types (${enabledTypes.size}/${typesTotal})`;
    const narrowed = enabled.size < total || enabledTypes.size < typesTotal;
    document.getElementById('filterCount').textContent = narrowed ? ' •' : '';
  }

  function renderFilters() {
    // Countries: single choice; picking one moves the map there
    const cp = document.getElementById('countryPanel');
    cp.innerHTML = '';
    [ALL, ...new Set(stations.map(s => s.country))].forEach(code => {
      const c = code === ALL ? ALL_COUNTRIES : (COUNTRIES[code] || { name: code, flag: '' });
      const n = code === ALL ? stations.length : stations.filter(s => s.country === code).length;
      const label = document.createElement('label');
      label.className = 'opt';
      label.innerHTML = `<input type="radio" name="country" ${code === country ? 'checked' : ''}>${c.flag} ${esc(c.name)}<span class="count">${n}</span>`;
      label.querySelector('input').addEventListener('change', () => {
        country = code;
        if (c.bounds) map.fitBounds(c.bounds);
        renderFilters(); applyFilters();
      });
      cp.appendChild(label);
    });
    cp.insertAdjacentHTML('beforeend', '<div class="opt soon">More countries coming soon</div>');

    // Operators: checklist, counts for the chosen country
    const op = document.getElementById('opPanel');
    op.innerHTML = `<div class="dd-actions"><button type="button" data-all="1">Select all</button><button type="button" data-all="0">Clear all</button></div>`;
    op.querySelectorAll('[data-all]').forEach(b => b.addEventListener('click', () => {
      Object.keys(operatorColor).forEach(o => b.dataset.all === '1' ? enabled.add(o) : enabled.delete(o));
      renderFilters(); applyFilters();
    }));
    Object.keys(operatorColor)
      .map(o => [o, stations.filter(s => s.operator === o && inCountry(s)).length])
      .filter(([, n]) => n > 0)
      .forEach(([o, n]) => {
        const label = document.createElement('label');
        label.className = 'opt';
        label.innerHTML = `<input type="checkbox" ${enabled.has(o) ? 'checked' : ''}>${brandMark(o)}${esc(o)}<span class="count">${n}</span>`;
        label.querySelector('input').addEventListener('change', e => {
          e.target.checked ? enabled.add(o) : enabled.delete(o);
          applyFilters();
        });
        op.appendChild(label);
      });

    // Types: checklist of venue types, plus one row for stations whose type isn't known
    const tp = document.getElementById('typePanel');
    tp.innerHTML = `<div class="dd-actions"><button type="button" data-all="1">Select all</button><button type="button" data-all="0">Clear all</button></div>`;
    tp.querySelectorAll('[data-all]').forEach(b => b.addEventListener('click', () => {
      allTypes().forEach(t => b.dataset.all === '1' ? enabledTypes.add(t) : enabledTypes.delete(t));
      renderFilters(); applyFilters();
    }));
    allTypes()
      .map(t => [t, stations.filter(s => typeKey(s) === t && inCountry(s)).length])
      .filter(([, n]) => n > 0)
      .forEach(([t, n]) => {
        const label = document.createElement('label');
        label.className = 'opt';
        const name = t === NO_TYPE ? '❔ Type not known' : `${PLACE_ICONS[t] || '📍'} ${esc(t)}`;
        label.innerHTML = `<input type="checkbox" ${enabledTypes.has(t) ? 'checked' : ''}>${name}<span class="count">${n}</span>`;
        label.querySelector('input').addEventListener('change', e => {
          e.target.checked ? enabledTypes.add(t) : enabledTypes.delete(t);
          applyFilters();
        });
        tp.appendChild(label);
      });
    renderFilterLabels();
  }

  // Clustering, like other map apps: zoomed out you see numbered bubbles; zooming in splits them
  // until single logo pins show. The cluster layer only draws what's in view, so panning stays fast.
  // Rebuilt only when a filter changes, not on every pan or zoom.
  const cluster = L.markerClusterGroup({
    chunkedLoading: true,              // add thousands of markers without freezing the page
    showCoverageOnHover: false,
    spiderfyOnMaxZoom: true,           // stations at the same address fan out when tapped
    disableClusteringAtZoom: 17,
    maxClusterRadius: z => z <= 9 ? 70 : z <= 13 ? 55 : 40,
    iconCreateFunction: c => {
      const n = c.getChildCount();
      const size = n < 10 ? 34 : n < 100 ? 40 : n < 1000 ? 48 : 56;
      return L.divIcon({ className: '', html: `<div class="cluster" style="width:${size}px;height:${size}px">${n}</div>`,
        iconSize: [size, size] });
    },
  }).addTo(map);

  function renderMarkers() {
    cluster.clearLayers();
    cluster.addLayers(stations.filter(isVisible).map(s => markers.get(s.id)));
  }

  // Zoom in to a station (opening its cluster if needed), then show its details
  function openStation(s, zoom = 17) {
    const m = markers.get(s.id);
    map.setView([s.lat, s.lng], zoom);
    // Right after a filter change the cluster layer is still adding markers in chunks; wait for it
    if (!m.__parent) { setTimeout(() => cluster.hasLayer(m) && openStation(s, zoom), 300); return; }
    cluster.zoomToShowLayer(m, () => m.openPopup());
  }

  function renderNearest() {
    const list = document.getElementById('nearest');
    const status = document.getElementById('status');
    list.innerHTML = '';
    const visibleCount = stations.filter(isVisible).length;
    if (!you) { status.textContent = `${visibleCount} stations shown. Set your location to see the nearest ones.`; return; }
    const NEAR_LIMIT_KM = 100; // farther than this isn't "near you" (e.g. browsing Spain from the Netherlands)
    const nearest = stations.filter(isVisible)
      .map(s => ({ s, km: haversineKm(you, s) }))
      .filter(({ km }) => km <= NEAR_LIMIT_KM)
      .sort((a, b) => a.km - b.km)
      .slice(0, NEAREST_COUNT);
    if (!nearest.length) status.textContent = visibleCount
      ? `${visibleCount} stations shown. None within ${NEAR_LIMIT_KM} km of your position.`
      : 'No stations for the selected filters.';
    else if (isPhone()) status.textContent = `${nearest.length} nearest of ${visibleCount} stations shown on the map`;
    else status.textContent = `Nearest ${nearest.length} of ${visibleCount} stations:`;
    renderStrip(nearest);
    nearest.forEach(({ s, km }) => {
      const li = document.createElement('li');
      li.className = 'card';
      const info = infoFor(s);
      li.innerHTML = `
        <div class="row">${opHeader(s)}<span class="dist">${fmtDist(km)}</span></div>
        ${info ? `<div class="meta price-line">💶 ${esc(info.price)} ${availChip(s)}</div>` : ''}
        <div class="venue">${openPill(openState(s))} ${placeIcon(s)} ${esc(s.name)}</div>
        <div class="meta">${esc(s.address)}${s.precision === 'street' ? ' (approximate)' : ''} · ~${walkMin(km)} min walk</div>
        <a href="${placeUrl(s)}" target="_blank" rel="noopener">View in Google Maps →</a>`;
      li.addEventListener('click', e => {
        if (e.target.tagName === 'A') return;
        if (isPhone()) setSheet(false);
        openStation(s);
      });
      list.appendChild(li);
    });
  }

  // Phone: nearest stations as a swipeable strip of small cards at the bottom of the map
  const strip = document.getElementById('nearStrip');
  L.DomEvent.disableClickPropagation(strip);
  L.DomEvent.disableScrollPropagation(strip);
  let stripDismissed = false;
  function renderStrip(nearest) {
    strip.innerHTML = '';
    strip.hidden = stripDismissed || !nearest.length;
    nearest.forEach(({ s, km }) => {
      const info = infoFor(s);
      const card = document.createElement('div');
      card.className = 'mini';
      card.innerHTML = `<div class="top">${brandMark(s.operator)}<span class="op" style="color:${operatorColor[s.operator]}">${esc(s.operator)}</span>
          <span class="km">${fmtDist(km)}</span></div>
        <div class="v">${openPill(openState(s))} ${availChip(s)} ${placeIcon(s)} ${esc(s.name)}</div>
        ${info ? `<div class="p">💶 ${esc(info.price)}</div>` : ''}`;
      card.addEventListener('click', () => openStation(s));
      strip.appendChild(card);
    });
    const close = document.createElement('div');
    close.className = 'mini close-card';
    close.title = 'Hide list';
    close.textContent = '✕';
    close.addEventListener('click', () => { stripDismissed = true; strip.hidden = true; });
    strip.appendChild(close);
    strip.scrollLeft = 0;
  }

  // When you're in another supported country than the one selected, switch to it
  function followCountry() {
    let best = null, bestKm = Infinity;
    stations.forEach(s => { const km = haversineKm(you, s); if (km < bestKm) { bestKm = km; best = s; } });
    if (country !== ALL && best && bestKm < 300 && best.country !== country) {
      country = best.country;
      renderFilters(); renderFilterLabels();
      return true;
    }
    return false;
  }

  function setYou(lat, lng, accuracy) {
    stripDismissed = false;
    you = { lat, lng };
    const followed = followCountry();
    if (!youMarker) {
      youMarker = L.marker([lat, lng], {
        icon: L.divIcon({ className: '', html: '<div class="you-dot"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }),
        zIndexOffset: 1000
      }).addTo(map).bindTooltip('You are here', { direction: 'top', offset: [0, -10] });
    } else {
      youMarker.setLatLng([lat, lng]);
    }
    if (youCircle) youCircle.remove();
    youCircle = accuracy ? L.circle([lat, lng], { radius: accuracy, weight: 1, fillOpacity: 0.08 }).addTo(map) : null;

    const near = stations.filter(isVisible)
      .sort((a, b) => haversineKm(you, a) - haversineKm(you, b)).slice(0, 3);
    map.fitBounds(L.latLngBounds([[lat, lng], ...near.map(s => [s.lat, s.lng])]).pad(0.3), { maxZoom: 17 });
    if (followed) renderMarkers();
    // Popups are built when opened (bindPopup with a function), so distances update by themselves
    renderNearest();
  }

  document.getElementById('locate').addEventListener('click', () => {
    const status = document.getElementById('status');
    if (!navigator.geolocation) { status.textContent = 'Your browser does not support location. Click on the map instead.'; return; }
    status.textContent = 'Finding your location…';
    navigator.geolocation.getCurrentPosition(
      p => setYou(p.coords.latitude, p.coords.longitude, p.coords.accuracy),
      () => { status.textContent = 'Location unavailable or denied. Click on the map to set your position.'; },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });

  map.on('click', e => setYou(e.latlng.lat, e.latlng.lng));
  hideOffline.addEventListener('change', () => { renderMarkers(); renderNearest(); });

  // Venues open and close while the page is open: refresh the Open/Closed badges every minute
  // (popups are rebuilt each time they open, so they're always current)
  setInterval(() => { if (stations.length) renderNearest(); }, 60000);

  fetch('stations.json', { cache: 'no-cache' }) // revalidate so data updates show up right away
    .then(r => r.json())
    .then(data => {
      stations = data.stations;
      snapshot = data.snapshot || {};
      [...new Set(stations.map(s => s.operator))].forEach((op, i) => {
        operatorColor[op] = OPERATOR_COLORS[op] || FALLBACK_COLORS[i % FALLBACK_COLORS.length];
        enabled.add(op);
      });
      allTypes().forEach(t => enabledTypes.add(t));
      stations.forEach(s => {
        const m = L.marker([s.lat, s.lng], { title: `${s.operator}: ${s.name}`, icon: logoIcon(s) }).bindPopup(() => popupHtml(s));
        if (LIVE_SOURCES[s.operator]) m.on('popupopen', () => refreshLive(s, m));
        markers.set(s.id, m);
      });
      renderFilters(); renderMarkers(); renderNearest();
    })
    .catch(() => { document.getElementById('status').textContent = 'Could not load station data.'; });
</script>
</body>
</html>
